agents:
  - name: searcher_bot
    role: "Поисковик"
    skills:
      - count_words
      - fetch_rss
    duties:
      - "Ищет новые тексты и материалы"
      - "Анализирует объём текста (подсчёт слов)"
      - "Передаёт данные писателю"

  - name: writer_bot
    role: "Писатель"
    skills:
      - filter_text
    duties:
      - "Фильтрует и очищает текст"
      - "Приводит текст к единому стилю"
      - "Передаёт результат редактору"

  - name: editor_bot
    role: "Редактор"
    skills: []
    duties:
      - "Проверяет грамматику и стиль"
      - "Фильтрует нежелательный контент"
      - "Готовит текст к оформлению"

  - name: designer_bot
    role: "Оформитель"
    skills: []
    duties:
      - "Добавляет визуальные элементы"
      - "Формирует структуру поста"
      - "Передаёт результат публикатору"

  - name: publisher_bot
    role: "Публикатор"
    skills: 
      -publish_telegram
    duties:
      - "Публикует посты в Telegram"
      - "Следит за корректностью формата"
      - "Отправляет данные аудитории"

  - name: audience_bot
    role: "Тестировщик / представитель аудитории"
    skills: []
    duties:
      - "Читает опубликованные посты"
      - "Даёт обратную связь"
      - "Фиксирует ошибки и пожелания"

  - name: dev_bot
    role: "Программист"
    skills: []
    duties:
      - "Поддерживает кодовую базу"
      - "Добавляет новые skills"
      - "Настраивает CI/CD и инфраструктуру"
